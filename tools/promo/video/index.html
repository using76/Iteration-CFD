<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Iterations-CFD - meteor-cfd F1 promo v2</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Noto Sans KR";
        src: url("assets/fonts/NotoSansKR-VF.ttf");
        font-weight: 100 900;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0e0f12;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e0f12;
        font-family: "Noto Sans KR", sans-serif;
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="90"
    >
      <div
        id="el-title"
        data-composition-id="title"
        data-composition-src="compositions/title.html"
        data-start="0"
        data-duration="6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-cad"
        data-composition-id="cad"
        data-composition-src="compositions/cad.html"
        data-start="6"
        data-duration="7.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-chat"
        data-composition-id="chat"
        data-composition-src="compositions/chat.html"
        data-start="13.5"
        data-duration="15"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-mesh"
        data-composition-id="mesh"
        data-composition-src="compositions/mesh.html"
        data-start="28.5"
        data-duration="9"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-solve"
        data-composition-id="solve"
        data-composition-src="compositions/solve.html"
        data-start="37.5"
        data-duration="10"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-cpturn"
        data-composition-id="cpturn"
        data-composition-src="compositions/cpturn.html"
        data-start="47.5"
        data-duration="6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-cpstills"
        data-composition-id="cpstills"
        data-composition-src="compositions/cpstills.html"
        data-start="53.5"
        data-duration="6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-reveal"
        data-composition-id="reveal"
        data-composition-src="compositions/reveal.html"
        data-start="59.5"
        data-duration="6.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-slice"
        data-composition-id="slice"
        data-composition-src="compositions/slice.html"
        data-start="66"
        data-duration="6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-close"
        data-composition-id="close"
        data-composition-src="compositions/close.html"
        data-start="72"
        data-duration="18"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="90"
        data-track-index="3"
        data-track-kind="captions"
        data-width="1920"
        data-height="1080"
      ></div>
      <audio id="el-master" src="assets/audio/master.wav" data-start="0" data-duration="90" data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
