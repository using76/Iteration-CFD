<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>captions</title>
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Noto Sans KR";
          src: url("assets/fonts/NotoSansKR-VF.ttf");
          font-weight: 100 900;
        }
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          font-family: "Noto Sans KR", sans-serif;
        }
        #captions-wrap {
          position: absolute;
          inset: 0;
        }
        #captions-wrap .cap {
          position: absolute;
          left: 96px;
          bottom: 88px;
          max-width: 1640px;
          word-break: keep-all;
          background: rgba(14, 15, 18, 0.82);
          border-radius: 14px;
          padding: 18px 28px;
          opacity: 0;
        }
        #captions-wrap .cap-ko {
          font-size: 44px;
          font-weight: 700;
          color: #f1f3f5;
          line-height: 1.3;
        }
        #captions-wrap .cap-en {
          font-size: 26px;
          font-weight: 400;
          color: #a7afb8;
          line-height: 1.35;
          margin-top: 6px;
        }
        #captions-chip {
          position: absolute;
          top: 72px;
          left: 96px;
          background: rgba(14, 15, 18, 0.82);
          border-radius: 10px;
          padding: 10px 18px;
          font-family: "IBM Plex Mono", "Noto Sans KR", monospace;
          font-variant-numeric: tabular-nums;
          font-size: 20px;
          font-weight: 400;
          color: #f1f3f5;
          opacity: 0;
        }
      </style>
      <div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
        <div id="captions-wrap">
          <div class="cap" id="captions-cad">
            <div class="cap-ko" id="captions-cad-k">실제 F1 2026 컨셉 CAD 모델</div>
            <div class="cap-en" id="captions-cad-e">A real F1 2026 concept CAD model</div>
          </div>
          <div class="cap" id="captions-chat1">
            <div class="cap-ko" id="captions-chat1-k">한국어로 요청하면, AI 어시스턴트가 스튜디오를 직접 조작합니다</div>
            <div class="cap-en" id="captions-chat1-e">Ask in plain Korean - the AI assistant drives the studio itself</div>
          </div>
          <div class="cap" id="captions-chat2">
            <div class="cap-ko" id="captions-chat2-k">형상을 열고, 해석 결과를 불러와 화면에 띄웁니다</div>
            <div class="cap-en" id="captions-chat2-e">It opens the geometry, loads the solve and puts it on screen</div>
          </div>
          <div class="cap" id="captions-mesh">
            <div class="cap-ko" id="captions-mesh-k">자체 격자 생성기 · 계단형 육면체 격자</div>
            <div class="cap-en" id="captions-mesh-e">In-house mesher - castellated hex mesh</div>
          </div>
          <div class="cap" id="captions-solve">
            <div class="cap-ko" id="captions-solve-k">GPU 한 장으로 1,000 스텝 의사-과도 해석</div>
            <div class="cap-en" id="captions-solve-e">1,000 pseudo-transient steps on a single GPU</div>
          </div>
          <div class="cap" id="captions-cp">
            <div class="cap-ko" id="captions-cp-k">차체 표면 압력 분포 (Cp)</div>
            <div class="cap-en" id="captions-cp-e">Surface pressure on the car (Cp)</div>
          </div>
          <div class="cap" id="captions-reveal">
            <div class="cap-ko" id="captions-reveal-k">유선 - 앞날개, 바퀴, 뒷날개 주위의 흐름</div>
            <div class="cap-en" id="captions-reveal-e">Streamlines around the front wing, wheels and rear wing</div>
          </div>
          <div class="cap" id="captions-slice">
            <div class="cap-ko" id="captions-slice-k">차량 중앙 단면의 유속 · 자유류 250 km/h</div>
            <div class="cap-en" id="captions-slice-e">Flow speed on the car's centre plane - free stream 250 km/h</div>
          </div>
          <div id="captions-chip">시연용 계산 · 검증된 공력 결과 아님 | Demonstration run - not a validated aerodynamic result</div>
        </div>
      </div>
      <script>
        var tl = gsap.timeline({ paused: true });
        var CAPS = [
          ["cad", 5.6, 12.5],
          ["chat1", 13.6, 21.0],
          ["chat2", 21.3, 28.5],
          ["mesh", 29.6, 37.5],
          ["solve", 38.6, 46.5],
          ["cp", 47.6, 61.0],
          ["reveal", 62.0, 67.5],
          ["slice", 68.6, 72.5],
        ];
        CAPS.forEach(function (c) {
          var id = c[0], tin = c[1], tout = c[2];
          tl.fromTo("#captions-" + id, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, tin);
          tl.fromTo("#captions-" + id + "-k", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35, ease: "power4.out" }, tin);
          tl.fromTo("#captions-" + id + "-e", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power4.out" }, tin + 0.12);
          tl.to("#captions-" + id, { opacity: 0, duration: 0.3, ease: "none" }, tout - 0.3);
        });
        tl.fromTo("#captions-chip", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 47.2);
        tl.to("#captions-chip", { opacity: 0, duration: 0.4, ease: "none" }, 72.4);
        window.__timelines["captions"] = tl;
      </script>
    </template>
  </body>
</html>
