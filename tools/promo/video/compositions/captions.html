<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>captions</title>

  <body>
    <template>
      <style>
        @font-face {
          font-family: "Noto Sans KR";
          src: url("assets/fonts/NotoSansKR-VF.ttf");
          font-weight: 100 900;
        }
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          font-family: "Noto Sans KR", sans-serif;
        }
        #captions-wrap {
          position: absolute;
          inset: 0;
        }
        #captions-wrap .cap {
          position: absolute;
          left: 96px;
          bottom: 88px;
          max-width: 1640px;
          word-break: keep-all;
          background: rgba(14, 15, 18, 0.82);
          border-radius: 14px;
          padding: 18px 28px;
          opacity: 0;
        }
        #captions-wrap .cap-ko {
          font-size: 44px;
          font-weight: 700;
          color: #f1f3f5;
          line-height: 1.3;
        }
        #captions-chip {
          position: absolute;
          top: 72px;
          left: 96px;
          background: rgba(14, 15, 18, 0.82);
          border-radius: 10px;
          padding: 10px 18px;
          font-family: "IBM Plex Mono", "Noto Sans KR", monospace;
          font-variant-numeric: tabular-nums;
          font-size: 20px;
          font-weight: 400;
          color: #f1f3f5;
          opacity: 0;
        }
      </style>
      <div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
        <div id="captions-wrap">
          <div class="cap" id="captions-V02">
            <div class="cap-ko" id="captions-V02-k">정교한 F1 2026 컨셉카, CAD 모델에서 바로 시작합니다.</div>
          </div>
          <div class="cap" id="captions-V03">
            <div class="cap-ko" id="captions-V03-k">평범한 말로 요청하면, AI 어시스턴트가<br />해석을 설정하고 스튜디오를 조작할 수 있습니다.</div>
          </div>
          <div class="cap" id="captions-V04">
            <div class="cap-ko" id="captions-V04-k">형상을 열고, 격자와 해석 결과를 불러와 화면에 띄웁니다.</div>
          </div>
          <div class="cap" id="captions-V05">
            <div class="cap-ko" id="captions-V05-k">자체 격자 생성기가 약 32분 만에 320만 셀을 만듭니다.</div>
          </div>
          <div class="cap" id="captions-V06">
            <div class="cap-ko" id="captions-V06-k">이어서 GPU 한 장, RTX 5070 Ti가<br />시속 250 km의 유동을 풉니다.</div>
          </div>
          <div class="cap" id="captions-V07">
            <div class="cap-ko" id="captions-V07-k">차체 모든 표면의 압력 분포.</div>
          </div>
          <div class="cap" id="captions-V08">
            <div class="cap-ko" id="captions-V08-k">유선이 앞날개, 바퀴, 뒷날개 위로 흐르는 공기를 따라갑니다.</div>
          </div>
          <div class="cap" id="captions-V09">
            <div class="cap-ko" id="captions-V09-k">중앙 단면이 후류를 보여줍니다.<br />CAD에서 유동장까지, 처음부터 끝까지.</div>
          </div>
          <div class="cap" id="captions-V10">
            <div class="cap-ko" id="captions-V10-k">AI 기반 CFD 솔버.</div>
          </div>
          <div class="cap" id="captions-V11">
            <div class="cap-ko" id="captions-V11-k">AI가 설정하고, GPU가 풉니다.</div>
          </div>
          <div class="cap" id="captions-V12">
            <div class="cap-ko" id="captions-V12-k">빠르고, 자동으로.</div>
          </div>
          <div id="captions-chip">시연용 계산 · 검증된 공력 결과 아님 | Demonstration run - not a validated aerodynamic result</div>
        </div>
      </div>
      <script>
        var tl = gsap.timeline({ paused: true });
        var CAPS = [
          ["V02", 6.55, 13.0],
          ["V03", 14.05, 20.59],
          ["V04", 21.15, 27.26],
          ["V05", 28.95, 35.04],
          ["V06", 37.85, 47.24],
          ["V07", 48.05, 51.32],
          ["V08", 59.95, 65.1],
          ["V09", 66.35, 71.59],
          ["V10", 72.45, 75.17],
          ["V11", 76.65, 79.8],
          ["V12", 79.85, 81.78]
        ];
        CAPS.forEach(function (c) {
          var id = c[0], tin = c[1], tout = c[2];
          tl.fromTo("#captions-" + id, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, tin);
          tl.fromTo("#captions-" + id + "-k", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35, ease: "power4.out" }, tin);
          tl.to("#captions-" + id, { opacity: 0, duration: 0.3, ease: "none" }, tout - 0.3);
        });
        tl.fromTo("#captions-chip", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 47.7);
        tl.to("#captions-chip", { opacity: 0, duration: 0.4, ease: "none" }, 71.4);
        window.__timelines["captions"] = tl;
      </script>
    </template>
  </body>
</html>
