<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>slice</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #0e0f12;
        }
        #slice-wrap {
          position: absolute;
          inset: 0;
        }
        #slice-drift {
          position: absolute;
          inset: 0;
          overflow: hidden;
          transform-origin: 30% 50%;
          will-change: transform;
        }
        #slice-drift img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
      </style>
      <div id="root" data-composition-id="slice" data-width="1920" data-height="1080">
        <div id="slice-wrap">
          <div id="slice-drift">
            <img src="assets/stills/slice.png" alt="" />
          </div>
        </div>
      </div>
      <script>
        var tl = gsap.timeline({ paused: true });
        tl.fromTo("#slice-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 0);
        tl.fromTo("#slice-drift", { scale: 1.0 }, { scale: 1.04, duration: 5, ease: "none" }, 0);
        tl.to("#slice-wrap", { opacity: 0, duration: 0.4, ease: "none" }, 4.6);
        window.__timelines["slice"] = tl;
      </script>
    </template>
  </body>
</html>
