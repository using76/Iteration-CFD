          tl.fromTo("#title-bgwrap", { scale: 1.08 }, { scale: 1.0, duration: 6, ease: "none", immediateRender: false }, 0);

          tl.fromTo("#title-mark-wave", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 2.78);
          tl.fromTo("#title-glow", { opacity: 0 }, { opacity: 0.3, duration: 0.9, ease: "power2.out" }, 2.80);

          tl.fromTo("#title-rule", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 3.34);
