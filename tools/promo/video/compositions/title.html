<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>title</title>
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Noto Sans KR";
          src: url("assets/fonts/NotoSansKR-VF.ttf");
          font-weight: 100 900;
        }
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #0e0f12;
          font-family: "Noto Sans KR", sans-serif;
        }
        #title-wrap {
          position: absolute;
          inset: 0;
        }
        #title-bgwrap {
          position: absolute;
          inset: 0;
          overflow: hidden;
          will-change: transform;
        }
        #title-bgwrap img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          opacity: 0.22;
          filter: blur(2px) brightness(0.6);
        }
        #title-glow {
          position: absolute;
          left: 50%;
          top: 50%;
          margin-left: -550px;
          margin-top: -360px;
          width: 1100px;
          height: 720px;
          background: radial-gradient(closest-side, rgba(255, 90, 54, 0.55), rgba(255, 90, 54, 0) 70%);
          opacity: 0;
          z-index: 1;
          will-change: opacity, transform;
        }
        #title-block {
          position: absolute;
          inset: 0;
          z-index: 2;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          text-align: center;
          padding: 72px 96px 88px 96px;
        }
        #title-name {
          font-size: 132px;
          font-weight: 800;
          color: #f1f3f5;
          line-height: 1.1;
        }
        #title-legal {
          font-size: 34px;
          font-weight: 500;
          color: #a7afb8;
          letter-spacing: 0.04em;
          line-height: 1.3;
          margin-top: 6px;
        }
        #title-rule {
          width: 120px;
          height: 2px;
          background: rgba(255, 255, 255, 0.14);
          margin: 34px auto;
        }
        #title-sub-ko {
          font-size: 60px;
          font-weight: 700;
          color: #f1f3f5;
          line-height: 1.25;
        }
        #title-sub-en {
          font-size: 30px;
          font-weight: 400;
          color: #a7afb8;
          line-height: 1.3;
          margin-top: 10px;
        }
      </style>
      <div id="root" data-composition-id="title" data-width="1920" data-height="1080">
        <div id="title-wrap">
          <div id="title-bgwrap">
            <img id="title-bg" src="assets/stills/streamlines.png" alt="" />
          </div>
          <div id="title-glow"></div>
          <div id="title-block">
            <div id="title-name">(주)Iterations</div>
            <div id="title-legal">Iterations Co., Ltd.</div>
            <div id="title-rule"></div>
            <div id="title-sub-ko">F1 레이싱카 공력해석 테스트</div>
            <div id="title-sub-en">F1 race-car aerodynamics test</div>
          </div>
        </div>
      </div>
      <script>
        var tl = gsap.timeline({ paused: true });
        tl.fromTo("#title-bgwrap", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.out" }, 0);
        tl.fromTo("#title-bgwrap", { scale: 1.08 }, { scale: 1.0, duration: 6, ease: "none", immediateRender: false }, 0);
        tl.fromTo("#title-glow", { opacity: 0 }, { opacity: 0.3, duration: 0.9, ease: "power2.out" }, 0.25);
        tl.fromTo("#title-name", { opacity: 0, y: 72 }, { opacity: 1, y: 0, duration: 0.2, ease: "power4.out" }, 0.3);
        tl.fromTo("#title-legal", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 0.45);
        tl.fromTo("#title-rule", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 0.6);
        tl.fromTo("#title-sub-ko", { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.18, ease: "power4.out" }, 2.4);
        tl.fromTo("#title-sub-en", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.15, ease: "power4.out" }, 2.55);
        tl.to("#title-wrap", { opacity: 0, duration: 0.4, ease: "none" }, 5.6);
        window.__timelines["title"] = tl;
      </script>
    </template>
  </body>
</html>
