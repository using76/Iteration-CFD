<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Iterations - defence drone showreel</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Noto Sans KR";
        src: url("assets/fonts/NotoSansKR-VF.ttf");
        font-weight: 100 900;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #070b10;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #070b10;
        font-family: "Noto Sans KR", sans-serif;
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="90"
    >
      <div
        id="el-title"
        data-composition-id="title"
        data-composition-src="compositions/title.html"
        data-start="0"
        data-duration="6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-problem"
        data-composition-id="problem"
        data-composition-src="compositions/problem.html"
        data-start="6"
        data-duration="8"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-setup"
        data-composition-id="setup"
        data-composition-src="compositions/setup.html"
        data-start="14"
        data-duration="11.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-solve"
        data-composition-id="solve"
        data-composition-src="compositions/solve.html"
        data-start="25.5"
        data-duration="10.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-review"
        data-composition-id="review"
        data-composition-src="compositions/review.html"
        data-start="36"
        data-duration="14"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-multiverse"
        data-composition-id="multiverse"
        data-composition-src="compositions/multiverse.html"
        data-start="50"
        data-duration="10"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-isaac"
        data-composition-id="isaac"
        data-composition-src="compositions/isaac.html"
        data-start="60"
        data-duration="10"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-bulc"
        data-composition-id="bulc"
        data-composition-src="compositions/bulc.html"
        data-start="70"
        data-duration="10.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-close"
        data-composition-id="close"
        data-composition-src="compositions/close.html"
        data-start="80.5"
        data-duration="9.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="90"
        data-track-index="3"
        data-track-kind="captions"
        data-width="1920"
        data-height="1080"
      ></div>
      <audio id="el-master" src="assets/audio/master.wav" data-start="0" data-duration="90" data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
