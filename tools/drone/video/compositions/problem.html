<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>problem</title>
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Noto Sans KR";
          src: url("assets/fonts/NotoSansKR-VF.ttf");
          font-weight: 100 900;
        }
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #070b10;
          font-family: "Noto Sans KR", sans-serif;
        }
        #problem-wrap {
          position: absolute;
          inset: 0;
        }
        #problem-bg, #problem-bg2 {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #problem-bg {
          filter: brightness(0.45) saturate(0.6) contrast(1.1);
        }
        #problem-bg2 {
          opacity: 0;
        }
        #problem-vignette {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse at center, rgba(7,11,16,0) 40%, rgba(7,11,16,0.85) 100%);
        }
        #problem-col {
          position: absolute;
          left: 96px;
          top: 300px;
        }
        #problem-tag {
          font-size: 22px;
          font-weight: 600;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: #14B8A6;
          line-height: 1.3;
          opacity: 0;
        }
        #problem-head {
          font-size: 104px;
          font-weight: 800;
          color: #f1f3f5;
          line-height: 1.05;
          margin-top: 18px;
          opacity: 0;
        }
        #problem-chips {
          display: flex;
          gap: 18px;
          margin-top: 40px;
        }
        #problem-chips .chip {
          font-size: 28px;
          font-weight: 700;
          color: #f1f3f5;
          line-height: 1.2;
          border: 1px solid rgba(20, 184, 166, 0.6);
          border-radius: 8px;
          padding: 8px 18px;
          opacity: 0;
        }
        #problem-ko {
          font-size: 30px;
          font-weight: 500;
          color: #a7afb8;
          line-height: 1.4;
          margin-top: 30px;
          opacity: 0;
        }
        #problem-label {
          position: absolute;
          right: 72px;
          top: 760px;
          font-size: 20px;
          font-weight: 400;
          color: #a7afb8;
          line-height: 1.4;
          background: rgba(7, 11, 16, 0.78);
          border-radius: 10px;
          padding: 8px 14px;
          opacity: 0;
        }
      </style>
      <div id="root" data-composition-id="problem" data-width="1920" data-height="1080">
        <div id="problem-wrap">
          <img id="problem-bg" src="assets/stills/hero_clean.png" alt="" />
          <img id="problem-bg2" src="assets/stills/downwash.png" alt="" />
          <div id="problem-vignette"></div>
          <div id="problem-col">
            <div id="problem-tag">DEFENCE · UAS</div>
            <div id="problem-head">Air you cannot see</div>
            <div id="problem-chips">
              <div class="chip" id="problem-chip1">ISR</div>
              <div class="chip" id="problem-chip2">LOGISTICS</div>
              <div class="chip" id="problem-chip3">SWARM</div>
            </div>
            <div id="problem-ko">정찰 · 물류 · 군집</div>
          </div>
          <div id="problem-label">PX4 x500 · forward flight 15 m/s</div>
        </div>
      </div>
      <script>
        var tl = gsap.timeline({ paused: true });
        tl.fromTo("#problem-wrap", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 0);
        tl.fromTo("#problem-tag", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.3);
        tl.fromTo("#problem-head", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.6);
        tl.fromTo("#problem-chip1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 1.0);
        tl.fromTo("#problem-chip2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 1.4);
        tl.fromTo("#problem-chip3", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 1.8);
        tl.fromTo("#problem-ko", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 2.0);
        tl.fromTo("#problem-label", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 4.4);
        tl.fromTo("#problem-bg", { scale: 1.0 }, { scale: 1.06, duration: 8, ease: "none", immediateRender: false }, 0);
        tl.fromTo("#problem-bg2", { opacity: 0 }, { opacity: 0.85, duration: 1.2, ease: "none", immediateRender: false }, 4.0);
        tl.to("#problem-wrap", { opacity: 0, duration: 0.4, ease: "none" }, 7.6);
        window.__timelines["problem"] = tl;
      </script>
    </template>
  </body>
</html>
