<html lang="ko">

  <body>
    <template>
      <style>
        @font-face {
          font-family: "Noto Sans KR";
          src: url("assets/fonts/NotoSansKR-VF.ttf");
          font-weight: 100 900;
        }
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #070b10;
          font-family: "Noto Sans KR", sans-serif;
        }
        #solve-wrap {
          position: absolute;
          inset: 0;
        }
        #solve-reveal, #solve-cp {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }

          position: absolute;
          inset: 0;
          opacity: 0;

          position: absolute;
          left: 72px;

          background: rgba(7, 11, 16, 0.80);
          border-radius: 16px;
          padding: 28px;

        #solve-tag {
          font-size: 22px;
          font-weight: 600;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: #14B8A6;
          line-height: 1.3;
          opacity: 0;
        }
        #solve-chart-row {
          display: flex;
          align-items: stretch;
          gap: 6px;
          margin-top: 16px;
        }
        #solve-axis {
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          font-size: 18px;
          font-weight: 400;
          color: #a7afb8;
          line-height: 1.2;
          height: 300px;
          font-variant-numeric: tabular-nums;

        #solve-res {
          display: block;
          clip-path: inset(0 100% 0 0);

          margin-top: 10px;
          font-size: 20px;
          font-weight: 400;
          line-height: 1.3;

          font-weight: 400;
          color: #a7afb8;
          line-height: 1.3;

          margin-top: 18px;

        tl.fromTo("#solve-tile1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, 1.1);
        tl.fromTo("#solve-tile2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, 1.22);

        tl.fromTo("#solve-label1", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.6);
        tl.to("#solve-label1", { opacity: 0, duration: 0.4, ease: "none" }, 4.6);
        tl.fromTo("#solve-label2", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 5.4);

        tl.to("#solve-card", { opacity: 0, duration: 0.4, ease: "none" }, 4.6);
        tl.to("#solve-wrap", { opacity: 0, duration: 0.4, ease: "none" }, 10.1);
