  <body>
    <template>
      <style>
        @font-face {
          font-family: "Noto Sans KR";
          src: url("assets/fonts/NotoSansKR-VF.ttf");
          font-weight: 100 900;
        }
        #root {
          position: absolute;

          color: #f1f3f5;
          line-height: 1.3;
        }
        #captions-chip {
          position: absolute;
          top: 72px;
          left: 96px;
          background: rgba(7, 11, 16, 0.82);
          border-radius: 10px;
          padding: 10px 18px;
          font-family: "Noto Sans KR", sans-serif;
          font-variant-numeric: tabular-nums;
          font-size: 20px;
          font-weight: 400;
          color: #f1f3f5;
          line-height: 1.4;

          <div class="cap" id="captions-V02">

      <script>
        var tl = gsap.timeline({ paused: true });
        var CAPS = [
          ["V02", 6.45, 9.96],
          ["V03", 10.15, 13.68],
          ["V04", 14.35, 19.6],
          ["V05", 19.65, 25.36],
          ["V06", 25.85, 31.4],
          ["V07", 31.45, 34.7],
          ["V08", 36.45, 41.7],
          ["V09", 41.75, 46.1],
          ["V10", 46.15, 49.87],
          ["V11", 50.55, 56.72],
          ["V12", 60.35, 65.9],
          ["V13", 65.95, 69.9],
          ["V14", 70.45, 75.83],
          ["V15", 75.95, 79.91],
          ["V16", 80.85, 85.83],
          ["V17", 85.95, 87.98]
        ];
        CAPS.forEach(function (c) {
          var id = c[0], tin = c[1], tout = c[2];
          tl.fromTo("#captions-" + id, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, tin);
          tl.fromTo("#captions-" + id + "-k", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35, ease: "power4.out" }, tin);
          tl.to("#captions-" + id, { opacity: 0, duration: 0.3, ease: "none" }, tout - 0.3);
        });
        tl.fromTo("#captions-chip", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 25.7);
        tl.to("#captions-chip", { opacity: 0, duration: 0.4, ease: "none" }, 49.4);
        window.__timelines["captions"] = tl;
